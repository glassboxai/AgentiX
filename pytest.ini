[pytest]
testpaths = tests
pythonpath = src .
norecursedirs = generated_tools .autotool .venv .git SKILLS
python_files = test_*.py
addopts = -ra --strict-markers -m "not frameworks and not windows_isolation and not browser and not windows_credentials"
xfail_strict = true
markers =
    browser: opt-in real Playwright browser against a disposable Gradio server; no model
    frameworks: opt-in real CrewAI/Gradio adapters; requires installed runtime dependencies
    windows_isolation: opt-in real Windows AppContainer execution of trusted temporary fixtures
    known_issue: desired security or correctness behavior not implemented yet
    windows_credentials: opt-in real Windows Credential Manager using disposable synthetic credentials
